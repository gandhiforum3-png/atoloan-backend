---
# ─────────────────────────────────────────────────────────────────────────────
# ExternalSecrets — sync secrets from AWS Secrets Manager into K8s Secret objects
# ClusterSecretStore is managed by the infra repo (secret-store-aws-prod.yaml)
# ─────────────────────────────────────────────────────────────────────────────

# Postgres credentials + host (all stored together in atoloan/postgres-prod)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atoloan-postgres-secret
  namespace: atoloan-backend-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secret-store
    kind: ClusterSecretStore
  target:
    name: atoloan-postgres-secret
    creationPolicy: Owner
  data:
    - secretKey: PGUSER
      remoteRef:
        key: atoloan/postgres-prod
        property: PGUSER
    - secretKey: PGPASSWORD
      remoteRef:
        key: atoloan/postgres-prod
        property: PGPASSWORD
    - secretKey: PGHOST
      remoteRef:
        key: atoloan/postgres-prod
        property: PGHOST
    - secretKey: PGPORT
      remoteRef:
        key: atoloan/postgres-prod
        property: PGPORT
    - secretKey: PGDATABASE
      remoteRef:
        key: atoloan/postgres-prod
        property: PGDATABASE

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atoloan-openai-secret
  namespace: atoloan-backend-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secret-store
    kind: ClusterSecretStore
  target:
    name: atoloan-openai-secret
    creationPolicy: Owner
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: atoloan/openai
        property: OPENAI_API_KEY

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atoloan-anthropic-secret
  namespace: atoloan-backend-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secret-store
    kind: ClusterSecretStore
  target:
    name: atoloan-anthropic-secret
    creationPolicy: Owner
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: atoloan/anthropic
        property: ANTHROPIC_API_KEY

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atoloan-sevencredit-secret
  namespace: atoloan-backend-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secret-store
    kind: ClusterSecretStore
  target:
    name: atoloan-sevencredit-secret
    creationPolicy: Owner
  data:
    - secretKey: SEVENCREDIT_ACCOUNT
      remoteRef:
        key: atoloan/sevencredit
        property: SEVENCREDIT_ACCOUNT
    - secretKey: SEVENCREDIT_PASSWORD
      remoteRef:
        key: atoloan/sevencredit
        property: SEVENCREDIT_PASSWORD
    - secretKey: SEVENCREDIT_CLIENT_ID
      remoteRef:
        key: atoloan/sevencredit
        property: SEVENCREDIT_CLIENT_ID
    - secretKey: SEVENCREDIT_CLIENT_SECRET
      remoteRef:
        key: atoloan/sevencredit
        property: SEVENCREDIT_CLIENT_SECRET

---
# ─────────────────────────────────────────────────────────────────────────────
# ConfigMap — non-secret configuration (prod-aws)
# Note: PGHOST / PGPORT / PGDATABASE come from the postgres secret in prod
# (secrets-prod.tf stores them all in atoloan/postgres-prod)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: atoloan-api-config
  namespace: atoloan-backend-prod
data:
  APP_ENV: "prod"
  SEVENCREDIT_ENV: "prod"
  CORS_ORIGINS: "https://atoloans.com,https://www.atoloans.com"

---
# ─────────────────────────────────────────────────────────────────────────────
# PersistentVolumeClaims — local-path (k3s default storage class)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: upload-pdfs
  namespace: atoloan-backend-prod
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: user-docs
  namespace: atoloan-backend-prod
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path

---
# ─────────────────────────────────────────────────────────────────────────────
# Deployment (prod-aws)
# 2 replicas across server + agent node (t3.small × 2)
# RollingUpdate ensures zero downtime on redeploy
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atoloan-api
  namespace: atoloan-backend-prod
  labels:
    app: atoloan-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: atoloan-api
  template:
    metadata:
      labels:
        app: atoloan-api
    spec:
      initContainers:
        - name: db-migrate
          image: gandhiforum3/atoloan-api:latest
          imagePullPolicy: Always
          command: ["python", "scripts/run_migrations.py"]
          envFrom:
            - configMapRef:
                name: atoloan-api-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: atoloan-postgres-secret
                  key: PGUSER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: atoloan-postgres-secret
                  key: PGPASSWORD
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: atoloan-postgres-secret
                  key: PGHOST
            - name: PGPORT
              valueFrom:
                secretKeyRef:
                  name: atoloan-postgres-secret
                  key: PGPORT
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: atoloan-postgres-secret
                  key: PGDATABASE

      containers:
        - name: api
          image: gandhiforum3/atoloan-api:latest
          imagePullPolicy: Always

          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

          ports:
            - containerPort: 8000

          # Non-secret config from ConfigMap
          envFrom:
            - configMapRef:
                name: atoloan-api-config

          # Secrets from AWS Secrets Manager (via External Secrets Operator)
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: atoloan-postgres-secret
                  key: PGUSER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: atoloan-postgres-secret
                  key: PGPASSWORD
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: atoloan-postgres-secret
                  key: PGHOST
            - name: PGPORT
              valueFrom:
                secretKeyRef:
                  name: atoloan-postgres-secret
                  key: PGPORT
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: atoloan-postgres-secret
                  key: PGDATABASE
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: atoloan-openai-secret
                  key: OPENAI_API_KEY
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: atoloan-anthropic-secret
                  key: ANTHROPIC_API_KEY
            - name: SEVENCREDIT_ACCOUNT
              valueFrom:
                secretKeyRef:
                  name: atoloan-sevencredit-secret
                  key: SEVENCREDIT_ACCOUNT
            - name: SEVENCREDIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: atoloan-sevencredit-secret
                  key: SEVENCREDIT_PASSWORD
            - name: SEVENCREDIT_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: atoloan-sevencredit-secret
                  key: SEVENCREDIT_CLIENT_ID
            - name: SEVENCREDIT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: atoloan-sevencredit-secret
                  key: SEVENCREDIT_CLIENT_SECRET

          volumeMounts:
            - name: upload-pdfs
              mountPath: /app/upload_pdf
            - name: user-docs
              mountPath: /app/user_uploaded_documents

          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

          readinessProbe:
            httpGet:
              path: /hello
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /hello
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3

      volumes:
        - name: upload-pdfs
          persistentVolumeClaim:
            claimName: upload-pdfs
        - name: user-docs
          persistentVolumeClaim:
            claimName: user-docs

---
# ─────────────────────────────────────────────────────────────────────────────
# Service
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: atoloan-api
  namespace: atoloan-backend-prod
spec:
  selector:
    app: atoloan-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
  type: ClusterIP

---
# ─────────────────────────────────────────────────────────────────────────────
# Ingress — nginx + cert-manager TLS (api.atoloans.com)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atoloan-api-ingress
  namespace: atoloan-backend-prod
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/enable-cors: "false"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.atoloans.com
      secretName: atoloan-api-tls
  rules:
    - host: api.atoloans.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: atoloan-api
                port:
                  number: 80
