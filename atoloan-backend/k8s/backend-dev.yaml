---
# ─────────────────────────────────────────────────────────────────────────────
# ExternalSecrets — sync secrets from Vault into K8s Secret objects (dev paths)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atoloan-postgres-secret
  namespace: atoloan-backend
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secret-store
    kind: ClusterSecretStore
  target:
    name: atoloan-postgres-secret
    creationPolicy: Owner
  data:
    - secretKey: PGUSER
      remoteRef:
        key: atoloan/postgres
        property: PGUSER
    - secretKey: PGPASSWORD
      remoteRef:
        key: atoloan/postgres
        property: PGPASSWORD

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atoloan-openai-secret
  namespace: atoloan-backend
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secret-store
    kind: ClusterSecretStore
  target:
    name: atoloan-openai-secret
    creationPolicy: Owner
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: atoloan/openai
        property: OPENAI_API_KEY

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atoloan-sevencredit-secret
  namespace: atoloan-backend
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secret-store
    kind: ClusterSecretStore
  target:
    name: atoloan-sevencredit-secret
    creationPolicy: Owner
  data:
    - secretKey: SEVENCREDIT_ACCOUNT
      remoteRef:
        key: atoloan/sevencredit
        property: SEVENCREDIT_ACCOUNT
    - secretKey: SEVENCREDIT_PASSWORD
      remoteRef:
        key: atoloan/sevencredit
        property: SEVENCREDIT_PASSWORD
    - secretKey: SEVENCREDIT_CLIENT_ID
      remoteRef:
        key: atoloan/sevencredit
        property: SEVENCREDIT_CLIENT_ID
    - secretKey: SEVENCREDIT_CLIENT_SECRET
      remoteRef:
        key: atoloan/sevencredit
        property: SEVENCREDIT_CLIENT_SECRET

---
# ─────────────────────────────────────────────────────────────────────────────
# ConfigMap — non-secret configuration (dev)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: atoloan-api-config
  namespace: atoloan-backend
data:
  APP_ENV: "dev"
  PGHOST: "postgres-svc.atoloan-postgres.svc.cluster.local"
  PGPORT: "5432"
  PGDATABASE: "atoloandb"
  SEVENCREDIT_ENV: "test"
  CORS_ORIGINS: "http://dev.atoloan.com"

---
# ─────────────────────────────────────────────────────────────────────────────
# PersistentVolumeClaims
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: upload-pdfs
  namespace: atoloan-backend
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: standard

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: user-docs
  namespace: atoloan-backend
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: standard

---
# ─────────────────────────────────────────────────────────────────────────────
# Deployment (dev)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atoloan-api
  namespace: atoloan-backend
  labels:
    app: atoloan-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atoloan-api
  template:
    metadata:
      labels:
        app: atoloan-api
    spec:
      containers:
        - name: api
          image: gandhiforum3/atoloan-api:latest
          imagePullPolicy: Always

          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

          ports:
            - containerPort: 8000

          # Non-secret config from ConfigMap
          envFrom:
            - configMapRef:
                name: atoloan-api-config

          # Secrets from Vault (via External Secrets operator)
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: atoloan-postgres-secret
                  key: PGUSER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: atoloan-postgres-secret
                  key: PGPASSWORD
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: atoloan-openai-secret
                  key: OPENAI_API_KEY
            - name: SEVENCREDIT_ACCOUNT
              valueFrom:
                secretKeyRef:
                  name: atoloan-sevencredit-secret
                  key: SEVENCREDIT_ACCOUNT
            - name: SEVENCREDIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: atoloan-sevencredit-secret
                  key: SEVENCREDIT_PASSWORD
            - name: SEVENCREDIT_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: atoloan-sevencredit-secret
                  key: SEVENCREDIT_CLIENT_ID
            - name: SEVENCREDIT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: atoloan-sevencredit-secret
                  key: SEVENCREDIT_CLIENT_SECRET

          volumeMounts:
            - name: upload-pdfs
              mountPath: /app/upload_pdf
            - name: user-docs
              mountPath: /app/user_uploaded_documents

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

          readinessProbe:
            httpGet:
              path: /hello
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /hello
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30

      volumes:
        - name: upload-pdfs
          persistentVolumeClaim:
            claimName: upload-pdfs
        - name: user-docs
          persistentVolumeClaim:
            claimName: user-docs

---
# ─────────────────────────────────────────────────────────────────────────────
# Service
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: atoloan-api
  namespace: atoloan-backend
spec:
  selector:
    app: atoloan-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
  type: ClusterIP
